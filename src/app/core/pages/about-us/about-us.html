<div class="min-h-screen bg-white flex flex-col page-entry font-bengali">
    <app-header type="landing" (back)="router.navigate(['/'])"></app-header>

    <main class="flex-grow">
        <!-- Hero Section -->
        <div class="hero-poster">
            <div class="container mx-auto px-6">
                <div class="flex flex-col items-center text-center py-20 md:py-32">
                    <div class="constituency-badge mb-6">ওয়েবসাইট টিম</div>
                    <h1 class="candidate-name">এই প্রচেষ্টার নেপথ্য কারিগরেরা</h1>
                    <p class="text-xl md:text-2xl text-white/80 font-medium max-w-2xl mx-auto leading-relaxed mt-4">
                        বাংলাদেশ জাতীয়তাবাদী দল (বিএনপি)-র এই ডিজিটাল প্রচেষ্টার নেপথ্যে নিরলস পরিশ্রম করেছেন
                        জাতীয়তাবাদী আদর্শের যে নিবেদিতপ্রাণ সৈনিকেরা, তাঁরা হলেন:
                    </p>
                </div>
            </div>
        </div>

        <!-- Content Section -->
        <div class="content-section">
            <div *ngFor="let team of teams" class="mb-24 last:mb-0">
                <div class="mb-12">
                    <div class="flex items-center gap-4 mb-2">
                        <h2 class="category-title mb-0">{{team.title}}</h2>
                        <div class="flex-grow h-px bg-gray-200"></div>
                    </div>
                    <p *ngIf="team.subtitle" class="text-gray-400 font-bold uppercase tracking-widest text-xs ml-4">
                        {{team.subtitle}}
                    </p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <div *ngFor="let member of team.members" class="member-card">
                        <div class="photo-wrapper">
                            <img [src]="member.photoUrl" [alt]="member.name">
                        </div>
                        <div class="member-info">
                            <h3 class="member-name pb-6">{{member.name}}</h3>
                            <!-- <p class="member-role">{{member.role}}</p> -->

                            <div class="social-links">
                                <a [href]="member.facebookLink" target="_blank" class="social-btn facebook"
                                    title="Facebook">
                                    <svg viewBox="0 0 24 24">
                                        <path
                                            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                                    </svg>
                                </a>
                                <a *ngIf="member.linkedinLink" [href]="member.linkedinLink" target="_blank"
                                    class="social-btn linkedin" title="LinkedIn">
                                    <svg viewBox="0 0 24 24">
                                        <path
                                            d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                                    </svg>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <app-footer></app-footer>
</div>
