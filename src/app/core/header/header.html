<!-- Top Sub-Header: Contact Info -->
<div class="w-full bg-bnp-green text-white py-1.5 px-4 sm:px-6 relative z-[110]">
    <div class="container mx-auto flex justify-end items-center">
        <a href="tel:16543" class="flex items-center space-x-2 group hover:opacity-90 transition-opacity">
            <span class="text-[10px] md:text-sm font-bold opacity-80">সহায়তা ও কন্টাক্ট সেন্টার</span>
            <div class="flex items-center gap-1.5 bg-white/10 px-3 py-0.5 rounded-full border border-white/20">
                <svg class="w-3 h-3 md:w-3.5 md:h-3.5" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z">
                    </path>
                </svg>
                <span class="text-sm md:text-base font-black italic tracking-tighter">১৬৫৪৩</span>
            </div>
        </a>
    </div>
</div>

<header [class]="headerClass">
    <div class="container mx-auto px-4 sm:px-6 flex justify-between items-center">
        <!-- Logo Section -->
        <div class="flex items-center space-x-2 sm:space-x-3 cursor-pointer" (click)="onLogoClick()">
            <img src="/bnp-flag.svg" alt="Logo" class="h-10 sm:h-12 w-auto">
            <div class="flex flex-col justify-center leading-tight">
                <span class="text-bnp-green font-bold text-[11px] sm:text-base md:text-lg whitespace-nowrap">বাংলাদেশ
                    জাতীয়তাবাদী দল - বিএনপি</span>
                <span class="text-bnp-green font-normal text-[9px] sm:text-[11px] md:text-sm">ত্রয়োদশ জাতীয় সংসদ
                    নির্বাচন</span>
            </div>
        </div>

        <!-- Right Action Section -->
        <div class="flex items-center space-x-4">
            <ng-container [ngSwitch]="type">
                <!-- Landing -->
                <ng-container *ngSwitchCase="'landing'">
                    <img src="/bangladesh_first.svg" alt="Bangladesh First"
                        class="h-16 sm:h-28 w-auto -my-4 sm:-my-8 translate-y-1 sm:translate-y-2">
                </ng-container>

                <!-- Candidate List -->
                <ng-container *ngSwitchCase="'candidate-list'">
                    <button (click)="onBackClick()"
                        class="text-xs font-bold text-gray-400 hover:text-gray-900 transition-colors">
                        &larr; ম্যাপে ফিরে যান
                    </button>
                </ng-container>

                <!-- Profile -->
                <ng-container *ngSwitchCase="'profile'">
                    <button (click)="onBackClick()"
                        class="px-6 py-2 border border-gray-900 text-gray-900 text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-gray-900 hover:text-white transition-all transform hover:scale-105 active:scale-95">
                        আরও দেখুন
                    </button>
                </ng-container>
            </ng-container>
        </div>
    </div>
</header>
