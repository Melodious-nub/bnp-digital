<!-- Top Sub-Header: Contact Info -->
<div class="w-full bg-bnp-green text-white py-1.5 px-4 sm:px-6 relative z-[110]">
    <div class="container mx-auto flex justify-end items-center">
        <a href="tel:16543" class="flex items-center space-x-2 group hover:opacity-90 transition-opacity">
            <span class="text-[10px] md:text-sm font-bold opacity-80">সহায়তার জন্য ফোন দিন</span>
            <div class="flex items-center gap-1.5 bg-white/10 px-3 py-0.5 rounded-full border border-white/20">
                <svg class="w-3 h-3 md:w-3.5 md:h-3.5" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z">
                    </path>
                </svg>
                <span class="text-sm md:text-base font-black italic tracking-tighter">১৬৫৪৩</span>
            </div>
        </a>
    </div>
</div>

<header [class]="headerClass">
    <div class="container mx-auto px-4 sm:px-6 flex justify-between items-center">
        <!-- Logo Section -->
        <div class="flex items-center space-x-2 sm:space-x-3 cursor-pointer shrink-0" (click)="onLogoClick()">
            <img src="/bnp-flag.svg" alt="Logo" class="h-10 sm:h-12 w-auto">
            <div class="flex flex-col justify-center leading-tight">
                <span class="text-bnp-green font-bold text-[11px] sm:text-base md:text-lg whitespace-nowrap">বাংলাদেশ
                    জাতীয়তাবাদী দল - বিএনপি</span>
                <span class="text-bnp-green font-normal text-[9px] sm:text-[11px] md:text-sm">ত্রয়োদশ জাতীয় সংসদ
                    নির্বাচন</span>
            </div>
        </div>

        <!-- Navigation Menus (Desktop) -->
        <nav class="hidden lg:flex items-center gap-2">
            <!-- Back to Map (Only if not on landing) -->
            <a *ngIf="type !== 'landing'" (click)="onBackClick()"
                class="group px-4 py-2.5 rounded-2xl text-sm font-black text-bnp-green bg-bnp-green/5 hover:bg-bnp-green/10 transition-all flex items-center gap-2.5 border border-bnp-green/10 cursor-pointer mr-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                <span>ম্যাপে ফিরে যান</span>
            </a>

            <a routerLink="/promise-wall" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
                class="nav-link group px-5 py-2.5 rounded-2xl text-sm font-black text-gray-600 hover:text-bnp-green hover:bg-bnp-green/5 transition-all flex items-center gap-2.5">
                <div
                    class="w-8 h-8 rounded-xl bg-gray-50 flex items-center justify-center group-hover:bg-bnp-green/10 transition-colors text-base">
                    ✊
                </div>
                <span>অঙ্গীকারনামা</span>
            </a>
            <a routerLink="/frame-editor" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
                class="nav-link group px-5 py-2.5 rounded-2xl text-sm font-black text-gray-600 hover:text-bnp-green hover:bg-bnp-green/5 transition-all flex items-center gap-2.5">
                <div
                    class="w-8 h-8 rounded-xl bg-gray-50 flex items-center justify-center group-hover:bg-bnp-green/10 transition-colors text-base">
                    🖼️
                </div>
                <span>ফটো ফ্রেম</span>
            </a>
        </nav>

        <!-- Right Action Section (Mobile Toggle) -->
        <div class="flex items-center lg:hidden">
            <button (click)="toggleMenu()" class="p-2 text-gray-600 hover:text-bnp-green transition-colors">
                <svg *ngIf="!isMobileMenuOpen" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
                        d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
                <svg *ngIf="isMobileMenuOpen" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Drawer -->
    <div *ngIf="isMobileMenuOpen"
        class="lg:hidden absolute top-full left-0 w-full bg-white border-b border-gray-100 shadow-2xl overflow-hidden animate-slideDown">
        <div class="flex flex-col p-6 gap-3">
            <!-- Back to Map (Mobile) -->
            <a *ngIf="type !== 'landing'" (click)="onBackClick(); toggleMenu()"
                class="px-5 py-4 rounded-2xl text-base font-black text-white bg-bnp-green flex items-center gap-4 transition-all active:scale-[0.98] shadow-lg shadow-bnp-green/20">
                <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-lg">
                    🗺️
                </div>
                <div class="flex flex-col">
                    <span>ম্যাপে ফিরে যান</span>
                </div>
                <svg class="w-5 h-5 ml-auto opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </a>

            <a routerLink="/promise-wall" routerLinkActive="bg-bnp-green/5 text-bnp-green" (click)="toggleMenu()"
                class="px-5 py-4 rounded-2xl text-base font-black text-gray-700 hover:bg-gray-50 flex items-center gap-4 transition-all active:scale-[0.98]">
                <div class="w-10 h-10 rounded-xl bg-bnp-green/10 flex items-center justify-center text-lg">
                    ✊
                </div>
                <div class="flex flex-col">
                    <span class="text-gray-900">অঙ্গীকারনামা</span>
                </div>
                <svg class="w-5 h-5 ml-auto opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M9 5l7 7-7 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </a>
            <a routerLink="/frame-editor" routerLinkActive="bg-bnp-green/5 text-bnp-green" (click)="toggleMenu()"
                class="px-5 py-4 rounded-2xl text-base font-black text-gray-700 hover:bg-gray-50 flex items-center gap-4 transition-all active:scale-[0.98]">
                <div class="w-10 h-10 rounded-xl bg-bnp-green/10 flex items-center justify-center text-lg">
                    🖼️
                </div>
                <div class="flex flex-col">
                    <span class="text-gray-900">ফটো ফ্রেম</span>
                </div>
                <svg class="w-5 h-5 ml-auto opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M9 5l7 7-7 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </a>
        </div>
    </div>
</header>
